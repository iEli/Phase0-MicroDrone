name: Docking CI

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'requirements-ci.txt'
      - 'docking/**'
      - 'motion_engine/**'
      - 'safety_layer/**'
      - 'tests/test_docking*.py'
      - 'tests/test_command_check.py'
      - 'tests/test_safety_policy.py'
      - 'tests/__init__.py'
      - 'INTEGRATION_README.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'requirements-ci.txt'
      - 'docking/**'
      - 'motion_engine/**'
      - 'safety_layer/**'
      - 'tests/test_docking*.py'
      - 'tests/test_command_check.py'
      - 'tests/test_safety_policy.py'
      - 'tests/__init__.py'
      - 'INTEGRATION_README.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docking-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docking-tests:
    name: Docking tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # pytest also runs unittest cases and emits JUnit XML reports.
      - name: Install test dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Run docking tests
        run: python -B -m pytest tests/test_docking*.py -v --junitxml=test-results/docking-1.xml

      - name: Run Safety command-check tests
        if: ${{ !cancelled() }}
        run: python -B -m pytest tests/test_command_check.py -v --junitxml=test-results/docking-2.xml

      - name: Run Safety policy tests
        if: ${{ !cancelled() }}
        run: python -B -m pytest tests/test_safety_policy.py -v --junitxml=test-results/docking-3.xml

      - name: Upload test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: docking-test-reports-python-${{ matrix.python-version }}-attempt-${{ github.run_attempt }}
          path: test-results/*.xml
          retention-days: 14
          if-no-files-found: warn
